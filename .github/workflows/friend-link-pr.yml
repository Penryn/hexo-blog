name: Friend Link PR

on:
  issues:
    types: [opened, edited, reopened]

concurrency:
  group: friend-link-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  create-friend-link-pr:
    if: startsWith(github.event.issue.title, '[友链申请]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or update friend-link PR
        uses: actions/github-script@v7
        with:
          script: |
            const { createFriendLinkPullRequest } = require('./.github/scripts/create-friend-link-pr.cjs');
            await createFriendLinkPullRequest({ github, context, core });
