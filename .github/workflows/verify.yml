name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm seo:obsidian:check
      - run: pnpm seo:frontmatter:check
      - run: pnpm seo:links:check
      - run: pnpm test
      - run: pnpm build
      - run: git diff --exit-code -- source/_posts
      - run: pnpm audit:prod
